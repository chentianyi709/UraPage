# 新工程仅引用根目录源码；本机配置由 Configs/Local.xcconfig 管理。
name: UraPage

options:
  minimumXcodeGenVersion: 2.42.0
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  bundleIdPrefix: try.jiezhoue
  deploymentTarget:
    iOS: 26.0
  developmentLanguage: zh-Hans

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: 5.12.0
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect.git
    from: 26.0.1
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.9.0
  ReerCodable:
    url: https://github.com/reers/ReerCodable.git
    from: 1.8.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.7

# 单一 Target：Sources 下按 App、Navigation、Core、CommonUI 与具体来源划分职责。
# CommonUI/Core 不引用具体来源，各来源互不引用；目录边界由约定与代码审查维护。
targets:
  UraPageApp:
    type: application
    platform: iOS
    sources:
      - Targets/UraPageApp/Sources
      - path: Targets/UraPageApp/Resources
        excludes:
          - Info.plist
          - Preview Content
      - path: Targets/UraPageApp/Resources/Preview Content
        buildPhase: none
    info:
      path: Targets/UraPageApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: UraPage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleAllowMixedLocalizations: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: try.jiezhoue.UraPage
        PRODUCT_NAME: UraPage
        # 发布版本与构建号集中维护，Info.plist 只引用这两个值。
        # 1.2.0：详情字段行改为来源可扩展的 ComicDetailField、书签只落库维度标识，
        # 本地数据与 1.1.0 不兼容（旧库需重建），因此按功能增量升次版本号。
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        DEVELOPMENT_ASSET_PATHS: '"Targets/UraPageApp/Resources/Preview Content"'
        # 目标级编译约束：项目级会与 SwiftUIIntrospect／SwiftSoup 自带的 -suppress-warnings 冲突。
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    dependencies:
      - package: Alamofire
      - package: Kingfisher
      - package: ReerCodable
      - package: SwiftSoup
      - package: SwiftUIIntrospect

schemes:
  UraPage:
    shared: true
    build:
      targets:
        UraPageApp: all
    run:
      config: Debug
    archive:
      config: Release
